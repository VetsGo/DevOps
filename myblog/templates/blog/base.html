{% load blog_tags %}
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}{% endblock %}</title>
    <link href="{% static 'css/blog.css' %}" rel="stylesheet">
</head>
<body>
    <div id="content">
        {% block content %}{% endblock %}
    </div>
    <div id="sidebar">
        <h2>About me</h2>
        <p>Вітаю вас на моєму блозі. Тут будуть публікуватисі мої опублікавані пости, якимим я хочу з вами всіма поділитися.<br>
        Я вже написав {% total_posts %} статей.</p>
    </div>
</body>
</html>
